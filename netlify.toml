# Netlify build settings. The Next.js runtime is detected automatically, so
# this file only has to cover the parts Netlify cannot guess.
[build]
  # Prisma 7 does not generate its client on install, so do that first.
  #
  # The build never opens a database connection — every data-backed page is
  # server-rendered on demand — but the environment contract in src/lib/env.ts
  # is validated at module load, so DATABASE_URL has to be set to something.
  # Netlify's managed Postgres only exists once a deploy has been published,
  # so the first build falls back to a value that is never dialled.
  command = 'export DATABASE_URL="${DATABASE_URL:-${NETLIFY_DATABASE_URL:-postgresql://set-at-runtime-not-build}}" && npx prisma generate && npm run build'
  publish = ".next"

[build.environment]
  # Match the Node version this project is developed against.
  NODE_VERSION = "22"

# Declared explicitly: auto-detection did not pick the runtime up on this site,
# and without it Netlify publishes .next as static files with no server, so
# every server-rendered route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
