# Netlify build settings. The Next.js runtime is detected automatically, so
# this file only has to cover the parts Netlify cannot guess.
[build]
  # Prisma 7 does not generate the client on install, and the hosted database
  # needs the migrations applied before the app that queries it boots.
  command = 'npx prisma generate && DATABASE_URL="${DATABASE_URL:-$NETLIFY_DATABASE_URL}" npx prisma migrate deploy && npm run build'
  publish = ".next"

[build.environment]
  # Match the Node version this project is developed against.
  NODE_VERSION = "22"
